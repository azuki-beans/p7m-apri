[project]
name = "p7m-apri"
version = "0.1.0"
description = "Apri file .p7m firmati e visualizza fatture elettroniche XML (FatturaPA) come PDF."
authors = [{ name = "Marco Pavanelli" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "Django>=6.0.9,<6.1",
    # Il parser del tracciato FatturaPA è una libreria a sé, senza dipendenze:
    # https://github.com/azuki-beans/fatturapa
    "fatturapa>=0.2,<1.0",
    "gunicorn>=26.2",
    "pyhanko[etsi,async-http]>=0.38",
    "weasyprint>=70",
]

[tool.poetry]
# App Django, non un pacchetto distribuibile: niente build/installazione del progetto.
package-mode = false
