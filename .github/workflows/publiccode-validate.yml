name: Validate publiccode.yml

# Il file publiccode.yml descrive i metadati del software per il catalogo
# Developers Italia: se non è valido, il crawler non indicizza il progetto.
# Meglio accorgersene qui che dopo la pubblicazione.
# Il filtro include anche questo workflow, altrimenti una modifica al solo
# file del workflow non farebbe partire nulla e resterebbe non verificata.
on:
  push:
    branches: [main]
    paths:
      - "publiccode.yml"
      - ".github/workflows/publiccode-validate.yml"
  pull_request:
    paths:
      - "publiccode.yml"
      - ".github/workflows/publiccode-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Serve a reviewdog per annotare la pull request con gli errori trovati.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida publiccode.yml
        uses: italia/publiccode-parser-action@v1.5.1
        with:
          publiccode: publiccode.yml
          # I commenti inline passano da reviewdog, che serve un token in
          # scrittura: lo abbiamo solo sulle pull request aperte da questo
          # repository. Sui push e sulle PR da un fork l'esito della
          # validazione resta comunque leggibile nel log del job.
          comment-on-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
