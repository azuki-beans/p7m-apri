releaseDate: "2026-07-26"

logo: brand/azuki-beans-logo.png

# Sostituisce 'legal.repoOwner', deprecato. Se il software passasse in
# titolarità a una PA, qui andrebbe 'urn:x-italian-pa:<codiceIPA>' — la forma
# che ha preso il posto di 'IT.riuso.codiceIPA'.
organisation:
  name: azuki-beans
  uri: "https://github.com/azuki-beans"

platforms:
  - web
  - linux

categories:
  - document-management
  - e-signature
  - billing-and-invoicing

